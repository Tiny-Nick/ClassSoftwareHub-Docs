name: 整理文档投稿

# 只处理「文档投稿」表单开出来的 issue：整理成 文档库/<id>/，校验，然后开草稿 PR。
# 权限只够写本仓库并在 issue 回帖；正文全程走环境变量，不拼进命令行。
on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: doc-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: startsWith(github.event.issue.title, '[文档投稿]')
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 整理成目录
        id: build
        continue-on-error: true
        run: node scripts/issue-to-doc.mjs

      - name: 回帖说明哪里不合格并关闭
        if: steps.build.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file submission-message.md
          gh issue close "$ISSUE_NUMBER" --reason "not planned"

      - name: 中止
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: 校验文档库
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-docs.mjs 2>&1 | tee validation.log

      - name: 校验失败时回帖并关闭
        if: steps.validate.outcome == 'failure'
        run: |
          {
            printf '自动整理生成了目录，但没通过文档库校验：\n\n```\n'
            tail -30 validation.log
            printf '```\n\n'
            printf '这条投稿已经关闭。请按上面的提示改好后，重新提交一份新的投稿 —— 编辑或重开这条 issue 都不会重新触发自动整理。\n'
          } > validation-message.md
          gh issue comment "$ISSUE_NUMBER" --body-file validation-message.md
          gh issue close "$ISSUE_NUMBER" --reason "not planned"
          exit 1

      - name: 提交分支并开草稿 PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "docs/issue-$ISSUE_NUMBER"
          git add -- "文档库"
          git commit -m "$(cat submission-title.txt)"
          # 同一条 issue 重跑时，上一次可能已经把分支推上去了；先删远端同名分支再推，
          # 否则会因为非快进而失败，看起来像新问题。删不掉（不存在）不算错。
          git push origin --delete "docs/issue-$ISSUE_NUMBER" || true
          git push -u origin "docs/issue-$ISSUE_NUMBER"
          url=$(gh pr create --draft --base main --head "docs/issue-$ISSUE_NUMBER" \
            --title "$(cat submission-title.txt)" --body-file submission-pr-body.md)
          printf '\n草稿 PR：%s\n' "$url" >> submission-message.md
          gh issue comment "$ISSUE_NUMBER" --body-file submission-message.md

      # 内容与格式都过了，却卡在后面的分支/提交/开 PR 上（例如分支重名、接口临时异常、
      # 仓库没有允许 Actions 创建 PR）。这类问题是流程自身出错，投稿内容本身不需要改，
      # 因此只回帖加标签、不关闭 issue —— 关掉会让正确的投稿白白流失。
      # 只在前两个分支都没走时才执行，避免对同一条 issue 重复回帖。
      - name: 意外失败时回帖并标记待处理
        if: failure() && steps.build.outcome == 'success' && steps.validate.outcome != 'failure'
        continue-on-error: true
        run: |
          {
            printf '这条投稿的自动整理没有跑完：内容与格式都通过了检查，但在生成分支或草稿 PR 时出错。\n\n'
            printf '这种情况属于流程本身的问题，投稿内容不需要修改，issue 已保留待维护者处理。\n\n'
            printf '维护者可按以下顺序处理：先在仓库设置中确认允许 Actions 创建拉取请求；\n'
            printf '再到本条 issue 的运行记录里重新运行一次，或者用下面的分支手动开草稿 PR。\n\n'
            printf '分支名：`docs/issue-%s`\n' "$ISSUE_NUMBER"
          } > failure-message.md
          gh issue comment "$ISSUE_NUMBER" --body-file failure-message.md || true
          gh issue edit "$ISSUE_NUMBER" --add-label "需要人工处理" || true
